version: "2"

# errcheck, govet, ineffassign, staticcheck, and unused are enabled by default
# in golangci-lint v2; gosimple was folded into staticcheck.
linters:
  enable:
    - misspell
    - gosec
    - bodyclose
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
