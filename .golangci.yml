version: "2"

# errcheck, govet, ineffassign, staticcheck, and unused are enabled by default
# in golangci-lint v2; gosimple was folded into staticcheck.
linters:
  enable:
    - misspell
    - gosec
    - bodyclose
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    # Same suppressions golangci-lint v1 applied by default (e.g. unchecked
    # Close(), gosec G104 duplicating errcheck).
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
